# Cloudflare Workers(静的アセット)への本番デプロイ。main への push で dist/ をビルドしてアップロードする。
# Cloudflare 側の Git 連携ビルドは使わない(ビルドは GitHub Actions で行い、成果物だけを送る)。
# Worker 名・配信ディレクトリ・カスタムドメインは wrangler.jsonc にある。
#
# 必要な設定(リポジトリの Secrets):
#   CLOUDFLARE_API_TOKEN  … 「Edit Cloudflare Workers」テンプレートで作った API トークン
#                           (Workers Scripts: Edit / Workers Routes: Edit、ゾーン hirotoyoshihara.dev を含める)
#   CLOUDFLARE_ACCOUNT_ID … アカウント ID

name: Deploy

on:
  push:
    branches: [main]
  # 手動でも流せるようにする(Secrets を入れ直したあとの確認など)
  workflow_dispatch:

permissions:
  contents: read

# 同時に 2 つ走らせない。後から来たものを待たせる(キャンセルすると古い方が本番に残りうる)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hirotoyoshihara.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - name: ビルド
        run: bun run build

      - name: Cloudflare Workers へデプロイ
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
