# Cloudflare Workers(静的アセット)への本番デプロイ。main への push で dist/ をビルドしてアップロードする。
# Cloudflare 側の Git 連携ビルドは使わない(ビルドは GitHub Actions で行い、成果物だけを送る)。
# ビルドとデプロイはジョブを分ける。ビルドでは依存パッケージのコード(postinstall やビルドプラグイン)が動くので、
# API トークンはそのジョブに渡さず、dist/ を artifact で受け取ったデプロイ側のジョブにだけ渡す。
# Worker 名・配信ディレクトリ・カスタムドメインは wrangler.jsonc にある。
#
# 必要な設定(リポジトリの Secrets):
#   CLOUDFLARE_API_TOKEN  … Account API Token(Manage Account → Account API Tokens)。
#                           Workers Scripts: Edit(対象に hyoshihara-dev を含める)/ Workers Routes: Edit
#                           (ゾーン hirotoyoshihara.dev)。shiritype などほかの Worker とは別のトークンにする
#   CLOUDFLARE_ACCOUNT_ID … アカウント ID
# GitHub の production 環境は、デプロイ元を main ブランチに限定している(workflow_dispatch で別ブランチを出せないように)。

name: Deploy

on:
  push:
    branches: [main]
  # 手動でも流せるようにする(Secrets を入れ直したあとの確認など)
  workflow_dispatch:

permissions:
  contents: read

# 同時に 2 つ走らせない。後から来たものを待たせる(キャンセルすると古い方が本番に残りうる)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - name: ビルド
        run: bun run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          # _headers(CSP など)はドットで始まらないので include-hidden-files は不要
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Cloudflare Workers
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hirotoyoshihara.dev
    steps:
      # wrangler.jsonc を読むためにチェックアウトする(依存のインストールとビルドはしない)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - name: Cloudflare Workers へデプロイ
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # 依存を入れないジョブなので、wrangler-action が入れる wrangler のバージョンを固定する
          wranglerVersion: '4.148.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
