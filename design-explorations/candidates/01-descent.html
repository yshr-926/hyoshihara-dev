<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>01 勾配降下 — hirotoyoshihara.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    />
    <style>
      /* レイアウト: 画面全体が損失曲面の等高線図。左(lg)に地形、右に本文の列。
         スクロール量 = SGD の反復回数で、読み終えるころ点が大域最小へ落ちる */
      :root {
        --paper: #f3f5f2;
        --sheet: rgb(255 255 255 / 0.86);
        --ink: #17201c;
        --muted: #5b6862;
        --contour: 34 92 78; /* 等高線の RGB */
        --path: #d2441f;
        --line: rgb(23 32 28 / 0.14);
        --font-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
        --font-mono: 'Martian Mono', ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #0d1412;
          --sheet: rgb(16 25 22 / 0.86);
          --ink: #e1ebe6;
          --muted: #8fa39a;
          --contour: 120 214 186;
          --path: #ff7a4d;
          --line: rgb(225 235 230 / 0.14);
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --paper: #0d1412;
        --sheet: rgb(16 25 22 / 0.86);
        --ink: #e1ebe6;
        --muted: #8fa39a;
        --contour: 120 214 186;
        --path: #ff7a4d;
        --line: rgb(225 235 230 / 0.14);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.8;
        letter-spacing: 0.02em;
      }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #path { pointer-events: none; }
      a { color: inherit; text-decoration-color: rgb(var(--contour) / 0.5); text-underline-offset: 4px; }
      a:hover { text-decoration-color: var(--path); }
      a:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; border-radius: 2px; }

      .hud {
        position: fixed;
        z-index: 3;
        left: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
        background: var(--sheet);
        border: 1px solid var(--line);
        padding: 8px 12px;
        backdrop-filter: blur(6px);
        font-variant-numeric: tabular-nums;
      }
      .hud b { color: var(--ink); font-weight: 500; }

      main {
        position: relative;
        z-index: 2;
        padding-inline: 16px;
        padding-block: 32px 120px;
        display: grid;
        gap: 72px;
      }
      @media (min-width: 1000px) {
        main { margin-left: 52%; max-width: 40rem; padding-inline: 0 32px; padding-block: 72px 200px; }
      }
      section {
        background: var(--sheet);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        padding: clamp(20px, 3vw, 32px);
      }
      .step {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 14px;
        font-variant-numeric: tabular-nums;
      }
      .step .t::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--path); margin-right: 8px; vertical-align: 1px; }
      h1 { font-size: clamp(44px, 9vw, 76px); font-weight: 900; line-height: 1; letter-spacing: -0.02em; margin: 0; }
      .en { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin: 10px 0 0; letter-spacing: 0.06em; }
      .role { margin: 28px 0 0; font-size: 20px; font-weight: 700; line-height: 1.4; }
      .domain { margin: 2px 0 0; color: var(--muted); }
      .intro { margin: 18px 0 0; font-size: 15px; color: var(--muted); }
      h2 { font-size: 20px; margin: 0 0 18px; letter-spacing: 0; }
      dl { margin: 0; display: grid; gap: 16px; }
      dt { font-weight: 700; font-size: 15px; }
      dd { margin: 4px 0 0; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
      .lang { margin: 18px 0 0; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
      ul { list-style: none; margin: 0; padding: 0; }
      .projects { display: grid; gap: 20px; }
      .projects h3 { margin: 0; font-size: 17px; }
      .projects p { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.7; }
      .stack { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
      .links { font-size: 13px; display: flex; gap: 16px; margin-top: 4px; }
      .rows { display: grid; gap: 10px; font-size: 15px; }
      .rows li { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 12px; }
      .rows time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 3px; }
      .now { color: var(--path); font-family: var(--font-body); }
      .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 26px 0 10px; letter-spacing: 0.08em; }
      .empty { font-size: 14px; color: var(--muted); margin: 0; }
      .contacts { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 15px; }
      .contacts a { display: inline-flex; min-height: 44px; align-items: center; gap: 8px; }
      .contacts small { color: var(--muted); font-size: 12px; }
      .updated { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 20px 0 0; }
      @media (max-width: 999px) {
        #land { opacity: 0.55; }
        .hud { display: none; }
        .rows li { grid-template-columns: 1fr; gap: 0; }
      }
    </style>
  </head>
  <body>
    <canvas id="land" aria-hidden="true"></canvas>
    <canvas id="path" aria-hidden="true"></canvas>
    <div class="hud" aria-hidden="true">
      t = <b id="hud-t">0</b> / <span id="hud-n">0</span><br />
      L(θ) = <b id="hud-l">0</b>
    </div>
    <main id="content"></main>

    <script src="profile-data.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script>
      const P = window.PROFILE;
      const esc = window.esc;

      // 損失曲面: 浅いお椀 + 3 つの谷(大域最小は右下)+ 細かい凹凸
      const f = (x, y) =>
        0.08 * (x * x + y * y) -
        1.4 * Math.exp(-((x - 1.3) ** 2 + (y + 0.9) ** 2) / 0.7) -
        0.9 * Math.exp(-((x + 1.4) ** 2 + (y - 0.9) ** 2) / 0.6) -
        0.6 * Math.exp(-((x + 0.2) ** 2 + (y + 1.9) ** 2) / 0.35) +
        0.12 * Math.sin(2.2 * x) * Math.cos(1.8 * y);
      const grad = (x, y) => {
        const h = 1e-4;
        return [(f(x + h, y) - f(x - h, y)) / (2 * h), (f(x, y + h) - f(x, y - h)) / (2 * h)];
      };

      // モメンタム付き SGD。いったん局所解(左上の谷)に寄ってから抜け出し、大域最小で止まる系列を選ぶ
      const N = 420;
      function run(seed) {
        const r = window.seeded(seed);
        const gauss = () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());
        let x = -2.7, y = 2.5, vx = 0, vy = 0, near = false;
        const pts = [[x, y]];
        for (let t = 0; t < N; t++) {
          const [gx, gy] = grad(x, y);
          const s = 1.4 * (1 - t / N) + 0.02;
          vx = 0.85 * vx - 0.05 * (gx + s * gauss());
          vy = 0.85 * vy - 0.05 * (gy + s * gauss());
          x += vx; y += vy;
          pts.push([x, y]);
          if (t < 250 && Math.hypot(x + 1.4, y - 0.9) < 0.4) near = true;
        }
        return { pts, ok: near && Math.hypot(x - 1.3, y + 0.9) < 0.35 };
      }
      let traj = run(6).pts;
      for (let s = 1; s < 300; s++) { const r = run(s); if (r.ok) { traj = r.pts; break; } }

      // セクションごとに「その位置での反復回数と損失」を見出しに出す
      const sections = ['profile', 'fields', 'projects', 'career', 'posts', 'contact'];
      const stepOf = (i) => Math.round((i / (sections.length - 1)) * N);
      const stepLabel = (i) => {
        const t = stepOf(i);
        const [x, y] = traj[t];
        return `<p class="step" aria-hidden="true"><span class="t">t = ${String(t).padStart(3, '0')}</span><span>L(θ) = ${f(x, y).toFixed(3)}</span></p>`;
      };

      const contacts = [...P.contacts].sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));
      document.getElementById('content').innerHTML = `
        <section id="profile">
          ${stepLabel(0)}
          <h1>${esc(P.fullNameJa)}</h1>
          <p class="en" lang="en">${esc(P.fullName)}</p>
          <p class="role">${esc(P.title)}</p>
          <p class="domain">${esc(P.domain)}</p>
          <p class="intro">${esc(P.intro)}</p>
        </section>
        <section id="fields" aria-labelledby="h-fields">
          ${stepLabel(1)}
          <h2 id="h-fields">専門領域</h2>
          <dl>${P.fieldGroups.map((g) => `<div><dt>${esc(g.label)}</dt><dd>${g.items.map((i) => `<span>${esc(i)}</span>`).join('')}</dd></div>`).join('')}</dl>
          <p class="lang">主な使用言語 ${P.languages.join(' / ')}</p>
        </section>
        <section id="projects" aria-labelledby="h-projects">
          ${stepLabel(2)}
          <h2 id="h-projects">個人開発</h2>
          <ul class="projects">${P.projects.map((p) => `
            <li>
              <h3>${esc(p.name)}</h3>
              <p>${esc(p.description)}</p>
              <div class="stack">${p.stack.map(esc).join(' · ')}</div>
              <div class="links"><a href="${p.href}">サイト</a>${p.repo ? `<a href="${p.repo}">リポジトリ</a>` : ''}</div>
            </li>`).join('')}
          </ul>
        </section>
        <section id="career" aria-labelledby="h-career">
          ${stepLabel(3)}
          <h2 id="h-career">経歴</h2>
          <ul class="rows">${P.career.map((c) => `<li><time>${c.from} — <span class="now">${c.to}</span></time><span>${esc(c.company)} / ${esc(c.role)}</span></li>`).join('')}</ul>
          <p class="sub" aria-hidden="true">EDUCATION</p>
          <ul class="rows">${P.education.map((e) => `<li><time>${e.year}</time><span>${esc(e.school)} ${esc(e.status)}</span></li>`).join('')}</ul>
          <p class="updated">最終更新 ${P.updatedAt}</p>
        </section>
        <section id="posts" aria-labelledby="h-posts">
          ${stepLabel(4)}
          <h2 id="h-posts">記事</h2>
          <p class="empty">公開した記事はここに新しい順で並びます(現在 0 件)。</p>
        </section>
        <section id="contact" aria-labelledby="h-contact">
          ${stepLabel(5)}
          <h2 id="h-contact">連絡先</h2>
          <ul class="contacts">${contacts.map((c) => `<li><a href="${c.href}" rel="me noopener">${esc(c.label)} <small>${esc(c.role)}</small></a></li>`).join('')}</ul>
        </section>`;

      // ---- 描画 ----
      const land = document.getElementById('land');
      const pathCv = document.getElementById('path');
      const lctx = land.getContext('2d');
      const pctx = pathCv.getContext('2d');
      let W, H, dpr, scale, cx, cy;
      const toPx = (x, y) => [cx + x * scale, cy - y * scale];
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      function layout() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        for (const c of [land, pathCv]) { c.width = W * dpr; c.height = H * dpr; }
        const wide = W >= 1000;
        // lg では左半分に地形を置く。狭い画面では全面に薄く敷く
        scale = wide ? Math.min(W * 0.5, H) / 6.6 : Math.max(W, H * 0.8) / 6.2;
        cx = wide ? W * 0.26 : W * 0.5;
        cy = H * 0.5;
        drawLand();
        drawPath();
      }

      function drawLand() {
        const cell = 4;
        // 外周の閉じ線が画面内に出ないよう、2 セルぶん外側まで計算する
        const n = Math.ceil(W / cell) + 5, m = Math.ceil(H / cell) + 5;
        const values = new Float64Array(n * m);
        for (let j = 0; j < m; j++)
          for (let i = 0; i < n; i++) values[j * n + i] = f(((i - 2) * cell - cx) / scale, (cy - (j - 2) * cell) / scale);
        const thresholds = d3.range(-1.3, 2.6, 0.1);
        const contours = d3.contours().size([n, m]).thresholds(thresholds)(values);
        lctx.setTransform(dpr * cell, 0, 0, dpr * cell, -2 * cell * dpr, -2 * cell * dpr);
        lctx.clearRect(0, 0, W, H);
        const rgb = css('--contour');
        const path = d3.geoPath(null, lctx);
        contours.forEach((c, k) => {
          const depth = 1 - k / thresholds.length; // 谷ほど濃く
          lctx.beginPath();
          path(c);
          lctx.strokeStyle = `rgb(${rgb} / ${(k % 5 === 0 ? 0.5 : 0.22) * (0.4 + depth)})`;
          lctx.lineWidth = (k % 5 === 0 ? 1.1 : 0.6) / cell;
          lctx.stroke();
        });
        lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // 大域最小の印(+)
        const [mx, my] = toPx(1.3, -0.9);
        lctx.strokeStyle = `rgb(${rgb} / 0.9)`;
        lctx.lineWidth = 1;
        lctx.beginPath(); lctx.moveTo(mx - 6, my); lctx.lineTo(mx + 6, my); lctx.moveTo(mx, my - 6); lctx.lineTo(mx, my + 6); lctx.stroke();
        lctx.font = `10px ${css('--font-mono')}`;
        lctx.fillStyle = `rgb(${rgb} / 0.9)`;
        lctx.fillText('θ*', mx + 8, my - 6);
      }

      function progress() {
        const max = document.documentElement.scrollHeight - innerHeight;
        return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 1;
      }

      function drawPath() {
        const t = Math.round(progress() * N);
        pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        pctx.clearRect(0, 0, W, H);
        const color = css('--path');
        pctx.strokeStyle = color;
        pctx.lineWidth = 1.4;
        pctx.lineJoin = 'round';
        pctx.globalAlpha = 0.85;
        pctx.beginPath();
        for (let i = 0; i <= t; i++) {
          const [px, py] = toPx(...traj[i]);
          i ? pctx.lineTo(px, py) : pctx.moveTo(px, py);
        }
        pctx.stroke();
        pctx.globalAlpha = 1;
        // 各セクションの位置に小さな目盛り
        sections.forEach((_, i) => {
          const s = stepOf(i);
          if (s > t) return;
          const [px, py] = toPx(...traj[s]);
          pctx.fillStyle = css('--paper');
          pctx.beginPath(); pctx.arc(px, py, 3.5, 0, Math.PI * 2); pctx.fill();
          pctx.strokeStyle = color; pctx.lineWidth = 1.2; pctx.stroke();
        });
        const [px, py] = toPx(...traj[t]);
        pctx.fillStyle = color;
        pctx.beginPath(); pctx.arc(px, py, 5.5, 0, Math.PI * 2); pctx.fill();
        document.getElementById('hud-t').textContent = String(t).padStart(3, '0');
        document.getElementById('hud-n').textContent = N;
        document.getElementById('hud-l').textContent = f(...traj[t]).toFixed(4);
      }

      let raf = 0;
      addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawPath); }, { passive: true });
      addEventListener('resize', layout);
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', layout);
      new MutationObserver(layout).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      document.fonts.ready.then(layout);
      layout();
    </script>
  </body>
</html>
